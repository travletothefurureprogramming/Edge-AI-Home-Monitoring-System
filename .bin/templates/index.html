<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edge AI Home Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
            --accent: #38bdf8;
        }

        body { 
            background: var(--bg); color: var(--text); 
            font-family: 'Inter', sans-serif; margin: 0;
            display: flex; flex-direction: column; 
            align-items: center; min-height: 100vh;
        }

        h1 { margin: 2rem 0; font-weight: 600; letter-spacing: -0.05em; }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px; width: 90%; max-width: 800px;
        }

        .card { 
            background: var(--card-bg); backdrop-filter: blur(10px);
            padding: 24px; border-radius: 20px; 
            border: 1px solid rgba(255,255,255,0.1); text-align: center;
        }

        h3 { margin-top: 0; font-size: 1.1rem; color: var(--accent); }

        button { 
            background: rgba(255,255,255,0.05); color: white; 
            border: 1px solid rgba(255,255,255,0.1); padding: 10px 15px; 
            margin: 5px; border-radius: 12px; cursor: pointer; 
            transition: all 0.2s ease;
        }

        button:hover { background: rgba(255,255,255,0.15); transform: translateY(-2px); }

        #aiInput {
            width: 80%; padding: 10px; border-radius: 10px;
            border: 1px solid var(--accent); background: rgba(255,255,255,0.05);
            color: white; margin-bottom: 10px;
        }

        .loader {
            display: none; border: 4px solid #f3f3f3; border-top: 4px solid var(--accent);
            border-radius: 50%; width: 20px; height: 20px;
            animation: spin 1s linear infinite; margin: 10px auto;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <h1>Edge AI Dashboard</h1>

    <div id="dashboard-container" class="container">
        <div class="card" style="grid-column: 1 / -1;">
            <h3>AI Assistant</h3>
            <input type="text" id="aiInput" placeholder="Ask anything...">
            <button onclick="askAI()">Ask</button>
            <div id="loader" class="loader"></div>
            <p id="aiResponse" style="margin-top: 10px; color: var(--accent);"></p>
        </div>
        <div class="card" id="automations-card" style="grid-column: 1 / -1; text-align:left;">
            <h3 style="text-align:center;">⚙️ Automations</h3>
        
            <div id="automations-list" style="margin-bottom: 16px;">
                <p style="color:gray; font-size:0.85rem;">Φόρτωση...</p>
            </div>
        
            <hr style="border-color: rgba(255,255,255,0.1);">
        
            <h4 style="color: var(--accent); margin-bottom: 8px;">Νέο Automation</h4>
        
            <div style="display:flex; flex-wrap:wrap; gap:8px; align-items:center;">
                <input type="text" id="auto-name" placeholder="Όνομα (π.χ. Sleep Lights Off)"
                    style="flex:1 1 200px; padding:8px; border-radius:8px; border:1px solid #333; background:#0f1115; color:#eee;">
        
                <select id="auto-trigger-type" onchange="toggleTriggerFields()"
                        style="padding:8px; border-radius:8px; background:#0f1115; color:#eee; border:1px solid #333;">
                    <option value="schedule">Ώρα (Schedule)</option>
                    <option value="event">Γεγονός (Event)</option>
                </select>
        
                <input type="time" id="auto-time"
                    style="padding:8px; border-radius:8px; background:#0f1115; color:#eee; border:1px solid #333;">
        
                <select id="auto-event" style="display:none; padding:8px; border-radius:8px; background:#0f1115; color:#eee; border:1px solid #333;">
                    <option value="person_detected">Ανίχνευση ατόμου</option>
                </select>
            </div>
        
            <div style="display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:8px;">
                <select id="auto-device" style="flex:1 1 220px; padding:8px; border-radius:8px; background:#0f1115; color:#eee; border:1px solid #333;">
                    <option value="">-- Επίλεξε συσκευή --</option>
                </select>
        
                <select id="auto-command" style="padding:8px; border-radius:8px; background:#0f1115; color:#eee; border:1px solid #333;">
                    <option value="on">ON</option>
                    <option value="off">OFF</option>
                </select>
        
                <button onclick="submitAutomation()">+ Προσθήκη</button>
            </div>
        
            <p id="automation-status" style="font-size:0.8rem; color: var(--accent); margin-top:6px;"></p>
        </div>
        </div>

   <script>

    const API_URL = window.location.hostname ? `${window.location.protocol}//${window.location.hostname}:8080` : "http://192.168.1.2:8080";

    async function loadDashboard() {
        try {
            const res = await fetch(`${API_URL}/api/devices`);
            const data = await res.json();
            const container = document.getElementById('dashboard-container');

            for (const [roomName, categories] of Object.entries(data.Room)) {
                for (const [category, devices] of Object.entries(categories)) {
                    for (const [id, dev] of Object.entries(devices)) {
                        
                        const card = document.createElement('div');
                        card.className = 'card';
                        card.innerHTML = `<h3>${dev.name}</h3><p style="font-size:0.8rem; color:gray;">${roomName.replace('_', ' ').toUpperCase()}</p>`;

                        if (category === 'lg_tv') {
                            const cmds = ['on', 'off', 'home', 'volume_up', 'volume_down', 'play', 'pause', 'stop', 'rewind', 'fast_forward'];
                            cmds.forEach(cmd => {
                                card.innerHTML += `<button onclick="sendTV('${dev.name}', '${roomName}', 'lg_tv', '${id}', '${cmd}')">${cmd.toUpperCase()}</button>`;
                            });
                        }
                        
                        else if (category === 'android_tv') {
                            const cmds = ['power', 'home', 'volume_up', 'volume_down','mute','channel_up','channel_down'];
                            cmds.forEach(cmd => {
                                card.innerHTML += `<button onclick="sendTV('${dev.name}', '${roomName}', 'android_tv', '${id}', '${cmd}')">${cmd.toUpperCase()}</button>`;
                            });
                        }

                        else if (category === 'tapo_light') {
                            const cmds = ['on', 'off'];
                            cmds.forEach(cmd => {
                                card.innerHTML += `<button onclick="sendtapo_light('${dev.name}', '${roomName}', 'tapo_light', '${id}', '${cmd}')">${cmd.toUpperCase()}</button>`;
                            });
                        }

                        else if (category === 'tapo_led_strip') {
                            const cmds = ['on', 'off'];
                            cmds.forEach(cmd => {
                                card.innerHTML += `<button onclick="sendtapo_led_strip('${dev.name}', '${roomName}', 'tapo_led_strip', '${id}', '${cmd}')">${cmd.toUpperCase()}</button>`;
                            });
                        }

                        else if (category === 'phue_light') {
                            const cmds = ['on', 'off'];
                            cmds.forEach(cmd => {
                                card.innerHTML += `<button onclick="sendphue_light('${dev.name}', '${roomName}', 'phue_light', '${id}','${cmd}')">${cmd.toUpperCase()}</button>`;
                            });
                        }

                        else if (category === 'yeelight') {
                            const cmds = ['on', 'off'];
                            cmds.forEach(cmd => {
                                card.innerHTML += `<button onclick="sendyeelight('${dev.name}', '${roomName}', 'yeelight', '${id}','${cmd}')">${cmd.toUpperCase()}</button>`;
                            });
                        }

                        else if (category === 'daikin_ac') {
                            const cmds = ['on', 'off', 'increase_temperature', 'decrease_temperature'];
                            cmds.forEach(cmd => {
                                card.innerHTML += `<button onclick="sendDaikin('${dev.name}', '${roomName}', 'daikin_ac', '${id}', '${cmd}')">${cmd.replace('_',' ').toUpperCase()}</button>`;
                            });

                            const modes = ['auto', 'cool', 'heat', 'dry', 'fan'];
                            let modeOptions = modes.map(m => `<option value="${m}">${m.toUpperCase()}</option>`).join('');
                            card.innerHTML += `
                                <div style="margin-top:8px;">
                                    <select id="mode-${roomName}-${id}">${modeOptions}</select>
                                    <button onclick="sendDaikinMode('${dev.name}', '${roomName}', 'daikin_ac', '${id}')">SET MODE</button>
                                </div>`;
                        }

                        else if (category === "shelly") {
                            const cmds = ['on', 'off'];
                            cmds.forEach(cmd => {
                                card.innerHTML += `<button onclick="sendShelly('${dev.name}', '${roomName}', 'shelly', '${id}','${cmd}')">${cmd.toUpperCase()}</button>`;

                            })
                        }

                        container.appendChild(card);
                    }
                }
            }
        } catch (err) { 
            console.error("Error loading devices:", err); 
        }
    }

    async function askAI() {
        const loader = document.getElementById('loader');
        const responseText = document.getElementById('aiResponse');
        const prompt = document.getElementById('aiInput').value;
        
        if(!prompt) return;
        
        loader.style.display = "block";
        responseText.innerText = "Thinking...";

        try {
            const res = await fetch(`${API_URL}/api/ai`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({prompt: prompt})
            });
            const data = await res.json();
            responseText.innerText = data.response;
        } catch (err) { 
            responseText.innerText = "Error connecting to AI."; 
        } finally { 
            loader.style.display = "none"; 
        }
    }

    // API Calls
    async function sendTV(device, room, type, id, cmd) {
        await fetch(`${API_URL}/api/tv`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ room: room, type: type, number: id, command: cmd, device: device})
        });
    }

    async function sendtapo_light(device, room, type, id, cmd) {
        await fetch(`${API_URL}/api/tapo_light`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ room: room, type: type, number: id, command: cmd, device: device})
        });
    }

    async function sendtapo_led_strip(device, room, type, id, cmd) {
        await fetch(`${API_URL}/api/tapo_led_strip`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ room: room, type: type, number: id, command: cmd, device: device})
        });
    }

    async function sendphue_light(device, room, type, id, cmd) {
        await fetch(`${API_URL}/api/phue_light`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ room: room, type: type, number: id, command: cmd, device: device})
        });
    }

    async function sendyeelight(device, room, type, id, cmd) {
        await fetch(`${API_URL}/api/yeelight`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ room: room, type: type, number: id, command: cmd, device: device})
        });
    }

    async function sendDaikin(device, room, type, id, cmd) {
        await fetch(`${API_URL}/api/daikin`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ room: room, type: type, number: id, command: cmd, device: device })
    });
}

    async function sendDaikinMode(device, room, type, id) {
        const select = document.getElementById(`mode-${room}-${id}`);
        const mode = select.value;
        await fetch(`${API_URL}/api/daikin`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ room: room, type: type, number: id, command: 'set_mode', mode: mode, device: device })
        });
    }

    async function sendShelly(device, room, type, id, cmd) {
        await fetch(`${API_URL}/api/shelly`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ room:room, type:type, number:id, command: cmd, device:device })
        });
    }

    let automationDeviceMap = {};
 
    function toggleTriggerFields() {
        const type = document.getElementById('auto-trigger-type').value;
        document.getElementById('auto-time').style.display = (type === 'schedule') ? 'inline-block' : 'none';
        document.getElementById('auto-event').style.display = (type === 'event') ? 'inline-block' : 'none';
    }

    function populateEventDropdown() {
        const eventSelect = document.getElementById('auto-event')
        eventSelect.innerHTML = '<option value="person_detected">🚨 Ανίχνευση ατόμου</option>';

        for (const [key, dev] of Object.entries(automationDeviceMap)){
            ['on', 'off'].forEach(cmd => {
                    const eventName = `${dev.room}_${dev.type}_${cmd}`;
                    const opt = document.createElement('option');
                    opt.value = eventName;
                    opt.textContent = `${dev.device} -> ${cmd.toLocaleUpperCase()}`;
                    eventSelect.appendChild(opt);
            }
            );
        }
    }

    function formatEventLabel(eventStr) {
        const parts = eventStr.split('_');
        const cmd = parts.pop();
        return `${parts.join(' ').replace(/\b\w/g, c => c.toUpperCase())} -> ${cmd.toUpperCase()}`;
    }
 
    async function loadAutomations() {
        const listEl = document.getElementById('automations-list');
        const deviceSelect = document.getElementById('auto-device');
 
        try {
            const devRes = await fetch(`${API_URL}/api/devices`);
            const devData = await devRes.json();
 
            deviceSelect.innerHTML = '<option value="">-- Επίλεξε συσκευή --</option>';
            automationDeviceMap = {};
 
            for (const [roomName, categories] of Object.entries(devData.Room)) {
                for (const [category, devices] of Object.entries(categories)) {
                    for (const [id, dev] of Object.entries(devices)) {
                        const key = `${roomName}|${category}|${id}`;
                        automationDeviceMap[key] = {
                            room: roomName,
                            type: category,
                            number: id,
                            device: dev.name,
                            model: dev.model || null
                        };
                        const opt = document.createElement('option');
                        opt.value = key;
                        opt.textContent = `${dev.name} (${roomName.replace('_',' ')})`;
                        deviceSelect.appendChild(opt);
                    }
                }
            }

            populateEventDropdown();
 
            const res = await fetch(`${API_URL}/api/automations`);
            const rules = await res.json();
 
            if (!rules.length) {
                listEl.innerHTML = '<p style="color:gray; font-size:0.85rem;">Δεν υπάρχουν automations ακόμα.</p>';
                return;
            }
 
            listEl.innerHTML = '';
            rules.forEach(rule => {
                const row = document.createElement('div');
                row.style = "display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid rgba(255,255,255,0.05);";
 
            const triggerLabel = rule.trigger.type === 'schedule'
                ? `⏰ ${rule.trigger.cron}`
                : `⚡ ${formatEventLabel(rule.trigger.event)}`;
            
                row.innerHTML = `
                    <span style="font-size:0.9rem;">
                        <strong>${rule.name}</strong>
                        <span style="color:gray; font-size:0.8rem;"> — ${triggerLabel}</span>
                    </span>
                    <button onclick="deleteAutomation('${rule.name}')" style="padding:4px 10px; font-size:0.8rem;">Διαγραφή</button>
                `;
                listEl.appendChild(row);
            });
 
        } catch (err) {
            listEl.innerHTML = '<p style="color:#ff6b6b; font-size:0.85rem;">Σφάλμα φόρτωσης automations.</p>';
            console.error("Error loading automations:", err);
        }
    }
 
    async function submitAutomation() {
        const statusEl = document.getElementById('automation-status');
        const name = document.getElementById('auto-name').value.trim();
        const triggerType = document.getElementById('auto-trigger-type').value;
        const deviceKey = document.getElementById('auto-device').value;
        const command = document.getElementById('auto-command').value;
 
        if (!name || !deviceKey) {
            statusEl.style.color = "#ff6b6b";
            statusEl.innerText = "Συμπλήρωσε όνομα και συσκευή.";
            return;
        }
 
        const dev = automationDeviceMap[deviceKey];
 
        const payload = {
            name: name,
            trigger_type: triggerType,
            room: dev.room,
            type: dev.type,
            number: dev.number,
            command: command,
            device: dev.device,
            model: dev.model
        };
 
        if (triggerType === 'schedule') {
            payload.time = document.getElementById('auto-time').value; // "HH:MM"
        } else {
            payload.event = document.getElementById('auto-event').value;
        }
 
        try {
            const res = await fetch(`${API_URL}/api/automations`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
 
            statusEl.style.color = res.ok ? "var(--accent)" : "#ff6b6b";
            statusEl.innerText = data.message || data.error || "Κάτι πήγε στραβά.";
 
            if (res.ok) {
                document.getElementById('auto-name').value = "";
                await loadAutomations();
            }
        } catch (err) {
            statusEl.style.color = "#ff6b6b";
            statusEl.innerText = "Σφάλμα σύνδεσης.";
            console.error(err);
        }
    }
 
    async function deleteAutomation(name) {
        try {
            await fetch(`${API_URL}/api/automations/${encodeURIComponent(name)}`, { method: 'DELETE' });
            await loadAutomations();
        } catch (err) {
            console.error("Error deleting automation:", err);
        }
    }

    window.onload = async () => {
        await loadDashboard();
        await loadAutomations();
    };
</script>
</body>
</html>
